name: Build Kernel
on:

  workflow_dispatch:

jobs:
  build:
    name: Build Kernel by ${{ github.actor }}
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
    steps:
    - uses: actions/checkout@v4
    - name: Prepare Configuration
      run: |
        CONFIG_ENV=$(cat config.env | grep -w "CONFIG_ENV" | head -n 1 | cut -d "=" -f 2)
        echo "KERNEL_SOURCE=$(cat $CONFIG_ENV | grep -w "KERNEL_SOURCE" | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "KERNEL_SOURCE_BRANCH=$(cat $CONFIG_ENV | grep -w "KERNEL_SOURCE_BRANCH" | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "KERNEL_CONFIG=$(cat $CONFIG_ENV | grep -w "KERNEL_CONFIG" | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "KERNEL_IMAGE_NAME=$(cat $CONFIG_ENV | grep -w "KERNEL_IMAGE_NAME" | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "ARCH=$(cat $CONFIG_ENV | grep -w "ARCH" | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "ADD_LOCALVERSION_TO_FILENAME=$(cat $CONFIG_ENV | grep -w "ADD_LOCALVERSION_TO_FILENAME" | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "EXTRA_CMDS=$(cat $CONFIG_ENV | grep -w "EXTRA_CMDS" | head -n 1 | cut -d ":" -f 2)" >> $GITHUB_ENV
        echo "USE_CUSTOM_CLANG=$(cat $CONFIG_ENV | grep -w "USE_CUSTOM_CLANG" | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "CUSTOM_CLANG_SOURCE=$(cat $CONFIG_ENV | grep -w "CUSTOM_CLANG_SOURCE" | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "CUSTOM_CLANG_BRANCH=$(cat $CONFIG_ENV | grep -w "CUSTOM_CLANG_BRANCH" | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "CUSTOM_CMDS=$(cat $CONFIG_ENV | grep -w "CUSTOM_CMDS" | head -n 1 | cut -d ":" -f 2)" >> $GITHUB_ENV
        echo "CLANG_BRANCH=$(cat $CONFIG_ENV | grep -w "CLANG_BRANCH" | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "CLANG_VERSION=$(cat $CONFIG_ENV | grep -w "CLANG_VERSION" | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "ENABLE_GCC_ARM64=$(cat $CONFIG_ENV | grep -w "ENABLE_GCC_ARM64" | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "ENABLE_GCC_ARM32=$(cat $CONFIG_ENV | grep -w "ENABLE_GCC_ARM32" | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "USE_CUSTOM_GCC_64=$(cat $CONFIG_ENV | grep -w "USE_CUSTOM_GCC_64" | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "CUSTOM_GCC_64_SOURCE=$(cat $CONFIG_ENV | grep -w "CUSTOM_GCC_64_SOURCE" | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "CUSTOM_GCC_64_BRANCH=$(cat $CONFIG_ENV | grep -w "CUSTOM_GCC_64_BRANCH" | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "CUSTOM_GCC_64_BIN=$(cat $CONFIG_ENV | grep -w "CUSTOM_GCC_64_BIN" | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "USE_CUSTOM_GCC_32=$(cat $CONFIG_ENV | grep -w "USE_CUSTOM_GCC_32" | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "CUSTOM_GCC_32_SOURCE=$(cat $CONFIG_ENV | grep -w "CUSTOM_GCC_32_SOURCE" | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "CUSTOM_GCC_32_BRANCH=$(cat $CONFIG_ENV | grep -w "CUSTOM_GCC_32_BRANCH" | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "CUSTOM_GCC_32_BIN=$(cat $CONFIG_ENV | grep -w "CUSTOM_GCC_32_BIN" | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "ENABLE_KERNELSU=$(cat $CONFIG_ENV | grep -w "ENABLE_KERNELSU" | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "KERNELSU_TAG=$(cat $CONFIG_ENV | grep -w "KERNELSU_TAG" | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "ADD_KPROBES_CONFIG=$(cat $CONFIG_ENV | grep -w "ADD_KPROBES_CONFIG" | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "DISABLE-LTO=$(cat $CONFIG_ENV | grep -w "DISABLE-LTO" | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "ADD_OVERLAYFS_CONFIG=$(cat $CONFIG_ENV | grep -w "ADD_OVERLAYFS_CONFIG" | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "DISABLE_CC_WERROR=$(cat $CONFIG_ENV | grep -w "DISABLE_CC_WERROR" | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "APPLY_KSU_PATCH=$(cat $CONFIG_ENV | grep -w "APPLY_KSU_PATCH" | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "USE_CUSTOM_ANYKERNEL3=$(cat $CONFIG_ENV | grep -w "USE_CUSTOM_ANYKERNEL3" | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "CUSTOM_ANYKERNEL3_SOURCE=$(cat $CONFIG_ENV | grep -w "CUSTOM_ANYKERNEL3_SOURCE" | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "CUSTOM_ANYKERNEL3_BRANCH=$(cat $CONFIG_ENV | grep -w "CUSTOM_ANYKERNEL3_BRANCH" | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "ENABLE_CCACHE=$(cat $CONFIG_ENV | grep -w "ENABLE_CCACHE" | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "NEED_DTBO=$(cat $CONFIG_ENV | grep -w "NEED_DTBO" | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "BUILD_BOOT_IMG=$(cat $CONFIG_ENV | grep -w "BUILD_BOOT_IMG" | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "SOURCE_BOOT_IMAGE=$(cat $CONFIG_ENV | grep -w "SOURCE_BOOT_IMAGE" | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "KSU_EXPECTED_SIZE=$(cat $CONFIG_ENV | grep -w "KSU_EXPECTED_SIZE" | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "KSU_EXPECTED_HASH=$(cat $CONFIG_ENV | grep -w "KSU_EXPECTED_HASH" | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "REMOVE_UNUSED_PACKAGES=$(cat $CONFIG_ENV | grep -w "REMOVE_UNUSED_PACKAGES" | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV

    - name: Remove unused packages
      if: env.REMOVE_UNUSED_PACKAGES == 'true'
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: ture
        android: false
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: false

    - name: Set swap to 10G
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 10

    - name: Setup build kernel environment
      run: |
        echo "BUILD_TIME=$(TZ=Asia/Shanghai date "+%Y%m%d%H%M")" >> $GITHUB_ENV
        echo "DEVICE=$(echo ${{ env.KERNEL_CONFIG }} | sed 's!vendor/!!;s/_defconfig//;s/_user//;s/-perf//')" >> $GITHUB_ENV
        sudo apt-get update
        sudo apt-get install -y git ccache automake flex lzop bison gperf build-essential zip curl zlib1g-dev g++-multilib libxml2-utils bzip2 libbz2-dev libbz2-1.0 libghc-bzlib-dev squashfs-tools pngcrush schedtool dpkg-dev liblz4-tool make optipng maven libssl-dev pwgen libswitch-perl policycoreutils minicom libxml-sax-base-perl libxml-simple-perl bc libx11-dev libgl1-mesa-dev xsltproc unzip device-tree-compiler python3 || true
        # Ubuntu 24.04 已移除的包（原模板遗留）：python2, lib32ncurses5-dev, libc6-dev-i386, lib32z-dev
        # 逐个尽力安装，失败也不阻断构建
        for pkg in python2 lib32ncurses5-dev libc6-dev-i386 lib32z-dev; do
          sudo apt-get install -y $pkg || echo "[skip] $pkg 在 Ubuntu 24.04 不可用，已跳过"
        done
        # 内核 5.4 构建脚本有时硬编码 `python`，但 24.04 只有 python3
        # 建软链接兜底（社区标准做法），避免 "python: not found"
        sudo ln -sf /usr/bin/python3 /usr/bin/python || true
        python --version || true
        mkdir -p $GITHUB_WORKSPACE/kernel_workspace

    - name: Download Clang-aosp
      if: env.USE_CUSTOM_CLANG != 'true'
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        mkdir clang-aosp
        # 带重试的下载（Google 源偶尔返回 503 / 网络抖动）
        fetch() {
          local url="$1" out="$2"
          for i in 1 2 3 4 5; do
            echo "[fetch] 第 $i 次尝试: $url"
            if wget -q --tries=2 --waitretry=5 --timeout=60 -O "$out" "$url"; then
              echo "[fetch] 成功: $out"; return 0
            fi
            echo "[fetch] 第 $i 次失败，等待后重试..."; rm -f "$out"; sleep 10
          done
          echo "[fetch] 最终失败: $url"; return 1
        }
        fetch "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/${{ env.CLANG_BRANCH }}/clang-${{ env.CLANG_VERSION }}.tar.gz" "clang-${{ env.CLANG_VERSION }}.tar.gz"
        tar -C clang-aosp/ -zxvf clang-${{ env.CLANG_VERSION }}.tar.gz

    - name: Download Custom-Clang
      if: env.USE_CUSTOM_CLANG == 'true'
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        if [[ ${{ env.CUSTOM_CLANG_SOURCE }} =~ git ]]; then
            if [[ ${{ env.CUSTOM_CLANG_SOURCE }} == *'.tar.gz' ]]; then
                wget -O clang.tar.gz ${{ env.CUSTOM_CLANG_SOURCE }}
                mkdir clang-aosp
                tar -C clang-aosp/ -zxvf clang.tar.gz
            else
                git clone ${{ env.CUSTOM_CLANG_SOURCE }} -b ${{ env.CUSTOM_CLANG_BRANCH }} clang-aosp --depth=1
            fi        
        else
            wget -O clang.zip ${{ env.CUSTOM_CLANG_SOURCE }}
            mkdir clang-aosp
            unzip clang.zip -d clang-aosp/
        fi

    - name: Download Gcc-aosp
      if: env.USE_CUSTOM_GCC_64 != 'true' || env.USE_CUSTOM_GCC_32 != 'true'
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        # 带重试的下载（Google 源偶尔 503）
        fetch() {
          local url="$1" out="$2"
          for i in 1 2 3 4 5; do
            echo "[fetch] 第 $i 次尝试: $url"
            if wget -q --tries=2 --waitretry=5 --timeout=60 -O "$out" "$url"; then
              echo "[fetch] 成功: $out"; return 0
            fi
            echo "[fetch] 第 $i 次失败，等待后重试..."; rm -f "$out"; sleep 10
          done
          echo "[fetch] 最终失败: $url"; return 1
        }
        if [ ${{ env.ENABLE_GCC_ARM64 }} = true ]; then
            mkdir gcc-64
            fetch "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz" gcc-aarch64.tar.gz
            tar -C gcc-64/ -zxvf gcc-aarch64.tar.gz
            echo "GCC_64=CROSS_COMPILE=$GITHUB_WORKSPACE/kernel_workspace/gcc-64/bin/aarch64-linux-android-" >> $GITHUB_ENV
        fi

        if [ ${{ env.ENABLE_GCC_ARM32 }} = true ]; then
            mkdir gcc-32
            fetch "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz" gcc-arm.tar.gz
            tar -C gcc-32/ -zxvf gcc-arm.tar.gz
            echo "GCC_32=CROSS_COMPILE_ARM32=$GITHUB_WORKSPACE/kernel_workspace/gcc-32/bin/arm-linux-androideabi-" >> $GITHUB_ENV
        fi

    - name: Download Custom-Gcc
      if: env.USE_CUSTOM_GCC_64 == 'true' || env.USE_CUSTOM_GCC_32 == 'true'
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        if [ ${{ env.USE_CUSTOM_GCC_64 }} = true ]; then
          if [[ ${{ env.CUSTOM_GCC_64_SOURCE }} =~ git ]]; then
              if [[ ${{ env.CUSTOM_GCC_64_SOURCE }} == *'.tar.gz' ]]; then
                wget -O gcc-64.tar.gz ${{ env.CUSTOM_CLANG_SOURCE }}
                mkdir gcc-64
                tar -C gcc-64/ -zxvf gcc-64.tar.gz
              else
                git clone ${{ env.CUSTOM_GCC_64_SOURCE }} -b ${{ env.CUSTOM_GCC_64_BRANCH }} gcc-64 --depth=1
              fi
          else
              wget -O gcc-64.zip ${{ env.CUSTOM_GCC_64_SOURCE }}
              mkdir gcc-64
              unzip gcc-64.zip -d gcc-64/
          fi
          echo "GCC_64=CROSS_COMPILE=$GITHUB_WORKSPACE/kernel_workspace/gcc-64/bin/${{ env.CUSTOM_GCC_64_BIN }}" >> $GITHUB_ENV
        fi

        if [ ${{ env.USE_CUSTOM_GCC_32 }} = true ]; then
          if [[ ${{ env.CUSTOM_GCC_32_SOURCE }} =~ git ]]; then
              if [[ ${{ env.CUSTOM_GCC_32_SOURCE }} == *'.tar.gz' ]]; then
                wget -O gcc-32.tar.gz ${{ env.CUSTOM_CLANG_SOURCE }}
                mkdir gcc-32
                tar -C gcc-32/ -zxvf gcc-32.tar.gz
              else
                git clone ${{ env.CUSTOM_GCC_32_SOURCE }} -b ${{ env.CUSTOM_GCC_32_BRANCH }} gcc-32 --depth=1
              fi
          else
            wget -O gcc-32.zip ${{ env.CUSTOM_GCC_32_SOURCE }}
            mkdir gcc-32
            unzip gcc-32.zip -d gcc-32/
          fi
          echo "GCC_32=CROSS_COMPILE=$GITHUB_WORKSPACE/kernel_workspace/gcc-32/bin/${{ env.CUSTOM_GCC_32_BIN }}" >> $GITHUB_ENV
        fi

    - name: Download mkbootimg tools
      if: env.BUILD_BOOT_IMG == 'true'
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone https://android.googlesource.com/platform/system/tools/mkbootimg tools -b master-kernel-build-2022 --depth=1

    - name: Download kernel source
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        # 带重试的克隆（网络抖动时自动重试）
        for i in 1 2 3; do
          echo "[clone] 第 $i 次尝试"
          if git clone ${{ env.KERNEL_SOURCE }} -b ${{ env.KERNEL_SOURCE_BRANCH }} android-kernel --depth=1; then
            echo "[clone] 成功"; break
          fi
          echo "[clone] 第 $i 次失败，清理后重试..."
          rm -rf android-kernel; sleep 10
          [ "$i" = 3 ] && { echo "[clone] 最终失败"; exit 1; }
        done

        # ══════════ 子模块（KernelSU）+ drivers/kernelsu 兜底 ══════════
        # 两棵 renoir/MIUI 树的 drivers/Kconfig 都写着：
        #   source "drivers/kernelsu/kernel/Kconfig"   (mint_renoir_kernel)
        #   source "drivers/kernelsu/Kconfig"          (sm8350-miui)
        # 而 drivers/kernelsu 是指向 KernelSU 子模块的软链。
        # git clone --depth=1 不拉子模块 -> kconfig 直接报：
        #   drivers/Kconfig:237: can't open file "drivers/kernelsu/..."
        #   make[2]: *** [scripts/kconfig/Makefile:90: ..._defconfig] Error 1
        if [ -f android-kernel/.gitmodules ]; then
          echo "[submodule] .gitmodules 内容:"
          sed 's/^/    /' android-kernel/.gitmodules
          ( cd android-kernel && git submodule update --init --recursive --depth=1 ) \
            || ( cd android-kernel && git submodule update --init --recursive ) \
            || echo "::warning::子模块拉取失败，转用兜底软链"
          ( cd android-kernel && git submodule status | sed 's/^/    /' ) || true
        fi

        # 兜底：无论子模块是否拉成功，都保证 drivers/kernelsu 可解析。
        # 链接目标由 drivers/Kconfig 里实际 source 的路径决定。
        pushd android-kernel >/dev/null
        if [ ! -e drivers/kernelsu ]; then
          KSU_EXPECT=$(grep -oE 'source "drivers/kernelsu[^"]*"' drivers/Kconfig | head -1)
          echo "[kernelsu] drivers/Kconfig 期望: $KSU_EXPECT"
          case "$KSU_EXPECT" in
            *"drivers/kernelsu/kernel/Kconfig"*) TGT="$(pwd)/KernelSU"        ;;  # 指向 KSU 仓库根
            *"drivers/kernelsu/Kconfig"*)        TGT="$(pwd)/KernelSU/kernel" ;;  # 指向 KSU kernel/
            *)                                    TGT="" ;;
          esac
          if [ -n "$TGT" ] && [ -d "$TGT" ]; then
            ln -sfn "$TGT" drivers/kernelsu
            echo "[kernelsu] 已建立软链 drivers/kernelsu -> $TGT"
          else
            echo "::error::KernelSU 源码缺失（$TGT 不存在），无法满足 drivers/Kconfig"
            exit 1
          fi
        fi
        echo "[kernelsu] drivers/kernelsu -> $(readlink -f drivers/kernelsu 2>/dev/null || echo '(实体目录)')"
        ls drivers/kernelsu/ 2>/dev/null | head -6 | sed 's/^/    /'
        if [ -f drivers/kernelsu/kernel/Kconfig ] || [ -f drivers/kernelsu/Kconfig ]; then
          echo "[kernelsu] ✅ Kconfig 存在，kconfig 不会再报错"
        else
          echo "::warning::drivers/kernelsu 尚不可用（将在下个步骤修复，不中断）"
        fi
        popd >/dev/null

    - name: Fix KernelSU source (源码树的 kernelsu 子模块缺 URL)
      # wannqn/mint_renoir_kernel 的 drivers/kernelsu 是个 gitlink(submodule)，
      # 但 .gitmodules 里没有它的 url，也不会被 git clone --depth=1 拉下来：
      #   fatal: No url found for submodule path 'drivers/kernelsu' in .gitmodules
      # 而该树的挂钩写得很明确：
      #   drivers/Kconfig:237   source "drivers/kernelsu/kernel/Kconfig"
      #   drivers/Makefile:192  obj-$(CONFIG_KSU) += kernelsu/kernel/
      # => drivers/kernelsu 必须是 KernelSU 仓库【根目录】（根下有 kernel/）。
      # KernelSU-Next 的根目录正是 .gitignore / LICENSE / kernel/ / uapi/ ——完全对上。
      #
      # 必须用 KernelSU-Next 而非 tiann 官方版：
      #   官方版自 v1.0.0 起放弃非 GKI 内核（5.4 只能用 v0.9.5 封顶）；
      #   KernelSU-Next 的 legacy 分支持续维护 4.9~5.4 非 GKI 支持。
      # 已核实作者 pin 的 0d6bdc63 就在 legacy 分支线上（compare: ahead_by=342, behind_by=0）。
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        KSU_REPO="https://github.com/KernelSU-Next/KernelSU-Next"
        KSU_PIN="0d6bdc6364cbfc73517dcfdf7ab23b0ba8045553"
        KSU_DIR="$GITHUB_WORKSPACE/kernel_workspace/KernelSU-Next"

        EXPECT=$(grep -oE 'source "drivers/kernelsu[^"]*"' drivers/Kconfig | head -1 | sed 's/source "//; s/"$//')
        echo "[kernelsu] drivers/Kconfig 期望路径: ${EXPECT:-（无）}"
        if [ -z "$EXPECT" ]; then echo "[kernelsu] 本树未挂载 KernelSU，跳过"; exit 0; fi

        # 注意：判据必须是「期望的文件存在」，不能用 -d —— 拉不下来的 gitlink
        # 会留下一个【空目录】，-d 会误判为已就绪（上次就是这么挂的）。
        if [ -f "$EXPECT" ]; then echo "[kernelsu] ✅ 已就绪: $EXPECT"; exit 0; fi

        ok=0
        for REF in "$KSU_PIN" legacy; do
          rm -rf "$KSU_DIR"
          if [ "$REF" = "$KSU_PIN" ]; then
            mkdir -p "$KSU_DIR"
            ( cd "$KSU_DIR" && git init -q && git remote add origin "$KSU_REPO" \
              && git fetch -q --depth=1 origin "$REF" && git checkout -q FETCH_HEAD ) && ok=1
          else
            git clone -q --depth=1 --branch "$REF" "$KSU_REPO" "$KSU_DIR" && ok=1
          fi
          [ "$ok" = 1 ] && { echo "[kernelsu] ✅ 已获取 $KSU_REPO @ $REF"; break; }
          echo "[kernelsu] ⚠️ $REF 获取失败，试下一个"
        done
        [ "$ok" = 1 ] || { echo "::error::KernelSU-Next 拉取失败"; exit 1; }

        echo "[kernelsu] 版本: $( cd "$KSU_DIR" && git log --oneline -1 )"
        [ -f "$KSU_DIR/kernel/Kconfig" ] || { echo "::error::KernelSU-Next 根下缺 kernel/Kconfig，布局不符"; exit 1; }

        rm -rf drivers/kernelsu
        ln -sfn "$KSU_DIR" drivers/kernelsu
        echo "[kernelsu] 软链: drivers/kernelsu -> $KSU_DIR"
        [ -f "$EXPECT" ] && echo "[kernelsu] ✅ 校验通过，$EXPECT 已可解析" \
          || { echo "::error::链接后仍无法解析 $EXPECT"; exit 1; }
        if [[ ${{ env.ADD_LOCALVERSION_TO_FILENAME }} == 'true' ]]; then
          echo "LOCALVERSION=$(cat android-kernel/localversion)" >> $GITHUB_ENV
        else
          echo "LOCALVERSION=" >> $GITHUB_ENV
        fi

    - name: Download source boot image
      if: env.BUILD_BOOT_IMG == 'true'
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        wget -O boot-source.img ${{ env.SOURCE_BOOT_IMAGE }}
        if [ -f boot-source.img ]; then
            echo "FORMAT_MKBOOTING=$(echo `tools/unpack_bootimg.py --boot_img=boot-source.img --format mkbootimg`)" >> $GITHUB_ENV
            echo "HAVE_SOURCE_BOOT_IMAGE=true" >> $GITHUB_ENV
        fi
  
    - name: Fix missing export - nl80211hdr_put (qcacld wlan.ko 需要)
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel || {
          echo "::error::内核源码目录不存在"; exit 1
        }
        F=net/wireless/nl80211.c
        if [ ! -f "$F" ]; then echo "::warning::$F 不存在，跳过"; exit 0; fi
        if grep -qE 'EXPORT_SYMBOL(_GPL)?\(nl80211hdr_put\)' "$F"; then
          echo "[OK] $F 已导出 nl80211hdr_put"
        else
          # 这棵树定义了 nl80211hdr_put 却没导出；而 qcacld 编成的 wlan.ko
          # 要调用它 -> modpost 报 "undefined!" -> 整个构建在 modules 阶段挂掉。
          # 原厂内核必然导出过它（否则原厂 wlan.ko 根本加载不了），
          # 所以这里补一行导出，是与原厂行为一致的补丁。
          # ABI 影响：只新增一个导出符号，不改变任何已有符号的 CRC。
          printf '\n/* 小米内核补充导出：qcacld 的 wlan.ko 需要调用 */\nEXPORT_SYMBOL(nl80211hdr_put);\n' >> "$F"
          echo "[OK] 已向 $F 追加 EXPORT_SYMBOL(nl80211hdr_put)"
        fi
        tail -3 "$F"
        grep -c 'EXPORT_SYMBOL(nl80211hdr_put)' "$F" | xargs -I{} echo "  导出出现次数: {}"

    - name: Fix hwid.h missing types.h (uint32_t 未定义)
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel || {
          echo "::error::内核源码目录不存在"; exit 1
        }
        F=include/linux/hwid.h
        if [ ! -f "$F" ]; then echo "[skip] $F 不存在"; exit 0; fi
        if grep -qE '#include <linux/types\.h>' "$F"; then
          echo "[OK] $F 已包含 linux/types.h"
        else
          # 这棵树用 uint32_t 却没 include types.h；有的消费者碰巧从
          # 别的头文件间接拿到，有的拿不到 -> 报 unknown type name 'uint32_t'。
          # 只补一行 include，不改任何类型定义，ABI 中立。
          sed -i '0,/#define __HWID_H__/s//#define __HWID_H__\n\n#include <linux\/types.h>/' "$F"
          echo "[OK] 已向 $F 注入 #include <linux/types.h>"
        fi
        grep -nE 'types\.h|#define __HWID_H__' "$F" | head -4

    - name: Force kernel version 5.4.233 - 对齐小米原厂 vermagic
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel || {
          echo "::error::内核源码目录不存在，前序 Download kernel source 没成功，无法锁定版本号"
          exit 1
        }
        echo "--- 修补前 ---"
        grep -nE '^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION) =' Makefile
        # 作者这棵树跟到了 5.4.268，而小米原厂内核是 5.4.233。
        # vermagic = VERSION.PATCHLEVEL.SUBLEVEL[-LOCALVERSION]，
        # SUBLEVEL 不改回 233，编出来的内核会被小米 stock 模块以
        # "version magic mismatch" 拒载 -> 模块加载失败 -> 卡 logo。
        # 只改版本号这一行，不动任何代码，ABI 零影响。
        sed -i -E 's/^SUBLEVEL = .*/SUBLEVEL = 233/' Makefile
        echo "--- 修补后 ---"
        grep -nE '^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION) =' Makefile
        V=$(grep -E '^SUBLEVEL = ' Makefile | awk '{print $3}')
        [ "$V" = "233" ] || { echo "::error::SUBLEVEL 修补失败，当前=$V"; exit 1; }
        echo "[OK] 内核版本已锁定为 5.4.233"

    - name: Install stock kernel config (extracted from factory boot.img)
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        cp $GITHUB_WORKSPACE/configs/renoir_stock_kernelsu_defconfig \
           arch/${{ env.ARCH }}/configs/renoir_stock_kernelsu_defconfig
        echo "[OK] 已安装原厂完整 config："
        wc -l arch/${{ env.ARCH }}/configs/renoir_stock_kernelsu_defconfig
        echo "--- 关键项自检 ---"
        grep -nE "^CONFIG_(LOCALVERSION|LTO|THINLTO|CFI_CLANG|SHADOW_CALL_STACK|MODVERSIONS|KPROBES|MODULES)=|^CONFIG_KSU=" \
           arch/${{ env.ARCH }}/configs/renoir_stock_kernelsu_defconfig
        echo "--- 必须存在的项（缺失则报错）---"
        for k in "CONFIG_LTO=y" "CONFIG_THINLTO=y" "CONFIG_CFI_CLANG=y" \
                 "CONFIG_SHADOW_CALL_STACK=y" "CONFIG_MODVERSIONS=y" \
                 "CONFIG_KPROBES=y" "CONFIG_KSU=y"; do
          if grep -qx "$k" arch/${{ env.ARCH }}/configs/renoir_stock_kernelsu_defconfig; then
            echo "  [OK] $k"
          else
            echo "::error::$k 缺失！会使内核与原厂模块 ABI 不兼容"
            exit 1
          fi
        done
        # ★★ 无 default 的 int 项必须显式赋值 ★★
        # 它们若缺失或为空，kconfig 在 syncconfig 阶段会报
        #   "warning: symbol value '' invalid for LITTLE_CPU_MASK"
        # 继而 "Error in reading or end of file" 【无限循环】，
        # 实测导致日志膨胀到 838MB、编译完全卡死。
        # 正确值来自原厂 defconfig（reno i r = 骁龙 780G 1+3+4 三丛集）。
        echo "--- 无 default 的 int 项（防 syncconfig 死循环）---"
        for kv in "CONFIG_LITTLE_CPU_MASK=15" "CONFIG_BIG_CPU_MASK=112" "CONFIG_PRIME_CPU_MASK=128"; do
          if grep -qx "$kv" arch/${{ env.ARCH }}/configs/renoir_stock_kernelsu_defconfig; then
            echo "  [OK] $kv"
          else
            echo "::error::缺少 $kv —— 会导致 kconfig syncconfig 死循环！"
            exit 1
          fi
        done

        # ★★ 重复赋值检测（防止静默覆盖）★★
        # 重复写同一符号时 kconfig 只发 warning，后写胜出。
        # 实测教训：整份追加原厂 vendor defconfig 造成 925 处覆盖，
        # 使 108 项配置偏离原厂（如原厂 DEBUG_FS=n 被改成 y）。
        echo "--- 重复赋值检测（防止静默覆盖）---"
        python3 $GITHUB_WORKSPACE/scripts/check_defconfig_dupes.py \
            arch/${{ env.ARCH }}/configs/renoir_stock_kernelsu_defconfig

    - name: Pre-scan missing headers - 提前揪出「被引用但源码树里没有」的头文件
      continue-on-error: true
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        echo "=================================================================="
        echo " 预扫描：被 #include 引用、但源码树里不存在的头文件"
        echo "=================================================================="
        echo " 为什么要有这步：小米公开的源码树漏发了文件。实测 <linux/usb/f_dtp.h>"
        echo " 在两棵公开树里都是 404，害得编译跑到 20-30 分钟才暴毙、白烧一次 CI。"
        echo " 这步只报告、不拦截（有些缺失是 #ifdef 关掉的，属于误报）。"
        echo
        INC=$GITHUB_WORKSPACE/inc_all.txt
        grep -rhoE '#include <[A-Za-z0-9_./+-]+>' --include=*.c --include=*.h \
             drivers techpack sound 2>/dev/null \
          | sed -E 's/#include <(.*)>/\1/' | sort -u > "$INC" || true
        echo "  被引用的头文件总数: $(wc -l < "$INC" 2>/dev/null || echo 0)"
        echo "  ────────────── 缺失清单 ──────────────"
        : > missing_headers.txt
        N=0
        while IFS= read -r inc; do
          [ -z "$inc" ] && continue
          # 只检查会按「源码树根」解析的 include（linux/xxx、asm/xxx 等）；
          # 像 ../../core/src/foo.h、../fts_fw.h、AR900B/hw/... 这种是按
          # 「包含它的那个文件所在目录」解析的，在这里判必然误报，直接跳过。
          case "$inc" in
            *..*) continue ;;
            linux/*|asm/*|asm-generic/*|soc/*|media/*|net/*|sound/*|video/*|dt-bindings/*|uapi/*|trace/*|crypto/*|keys/*|kvm/*|dma/*|misc/*|pinctrl/*|regulator/*|power/*|clk/*|bus/*|iio/*|mfd/*|mmc/*|mtd/*|phy/*|pwm/*|rtc/*|spi/*|thermal/*|tty/*|usb/*|w1/*|watchdog/*|scsi/*|nvme/*|pci/*|acpi/*|target/*|input/*|leds/*|mailbox/*|slimbus/*|spmi/*|platform_data/*) ;; 
            *) continue ;;
          esac
          if [ -f "include/$inc" ] \
             || [ -f "arch/${{ env.ARCH }}/include/$inc" ] \
             || [ -f "arch/${{ env.ARCH }}/include/generated/$inc" ] \
             || [ -f "include/generated/$inc" ]; then
            continue
          fi
          N=$((N+1))
          echo "  [缺失] $inc" | tee -a missing_headers.txt
        done < "$INC"
        echo "  ──────────────────────────────────────"
        echo "  缺失合计: $N 个"
        echo
        echo "  ★ 若其中任何一个属于本次会编译到的驱动，编译必然失败。"
        echo "    修法二选一：① 补上该头文件  ② 在 defconfig 里关掉对应驱动。"

    - name: Upload pre-scan result - 让「缺失清单」不用等编译结束就能取到
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: missing-headers-${{ github.run_number }}
        path: missing_headers.txt
        if-no-files-found: ignore
        retention-days: 3

    - name: Setup KernelSU
      if: env.ENABLE_KERNELSU == 'true'
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        rm -rf KernelSU drivers/kernelsu
        curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s ${{ env.KERNELSU_TAG }}
        KSU_VERSION=$(cd KernelSU && expr $(/usr/bin/git rev-list --count HEAD) + 10200)
        echo "UPLOADNAME=-KernelSU_$KSU_VERSION" >> $GITHUB_ENV

    - name: Setup Configuration for Kernel
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel

        # ============ 【关键】强制内核版本号与原厂完全一致（vermagic） ============
        # 原厂 MIUI 内核: 5.4.233-qgki-ge0ae3f4f4643
        # 默认编译结果:   5.4.233-qgki-g2fe7b2327396-dirty
        #
        # 为何必须一致：
        #   kernel/module.c 的 check_modinfo() 会严格比对模块的 vermagic，
        #   不一致时拒绝加载：
        #     "version magic '5.4.233-qgki-g...' should be '5.4.233-qgki-ge0ae3f4f4643'"
        #   本内核 MODULES=y，且原厂 /vendor/lib/modules 下有上千个模块
        #   （WiFi/相机/音频/显示...），vemagic 不一致 = 无法开机。
        #
        # 达成方式（scripts/setlocalversion）：
        #   res = ${CONFIG_LOCALVERSION} + ${scm_version}
        #   1) 把 CONFIG_LOCALVERSION 写成完整后缀
        #   2) 放一个空的 .scmversion，scm_version() 会直接 cat 它并返回
        #      -> 不再追加 -g<hash> / -dirty / +
        #   3) 同时关闭 LOCALVERSION_AUTO 双保险
        sed -i 's|^CONFIG_LOCALVERSION=.*|CONFIG_LOCALVERSION="-qgki-ge0ae3f4f4643"|' arch/${{ env.ARCH }}/configs/${{ env.KERNEL_CONFIG }}
        sed -i '/^CONFIG_LOCALVERSION_AUTO=/d' arch/${{ env.ARCH }}/configs/${{ env.KERNEL_CONFIG }}
        sed -i '/^# CONFIG_LOCALVERSION_AUTO is not set/d' arch/${{ env.ARCH }}/configs/${{ env.KERNEL_CONFIG }}
        echo "# CONFIG_LOCALVERSION_AUTO is not set" >> arch/${{ env.ARCH }}/configs/${{ env.KERNEL_CONFIG }}
        : > .scmversion
        echo "[OK] LOCALVERSION 设置："
        grep -n "LOCALVERSION" arch/${{ env.ARCH }}/configs/${{ env.KERNEL_CONFIG }}

        if [ ${{ env.APPLY_KSU_PATCH }} = true ]; then
            bash $GITHUB_WORKSPACE/patches/patches.sh
            if grep -q "CONFIG_KSU" arch/${{ env.ARCH }}/configs/${{ env.KERNEL_CONFIG }}; then
                sed -i 's/# CONFIG_KSU is not set/CONFIG_KSU=y/g' arch/${{ env.ARCH }}/configs/${{ env.KERNEL_CONFIG }}
                sed -i 's/CONFIG_KSU=n/CONFIG_KSU=y/g' arch/${{ env.ARCH }}/configs/${{ env.KERNEL_CONFIG }}
            else
                echo "CONFIG_KSU=y" >> arch/${{ env.ARCH }}/configs/${{ env.KERNEL_CONFIG }}
            fi
        fi
        if [ ${{ env.ADD_KPROBES_CONFIG }} = true -a ${{ env.APPLY_KSU_PATCH }} != true ]; then
            echo "CONFIG_MODULES=y" >> arch/${{ env.ARCH }}/configs/${{ env.KERNEL_CONFIG }}
            echo "CONFIG_KPROBES=y" >> arch/${{ env.ARCH }}/configs/${{ env.KERNEL_CONFIG }}
            echo "CONFIG_HAVE_KPROBES=y" >> arch/${{ env.ARCH }}/configs/${{ env.KERNEL_CONFIG }}
            echo "CONFIG_KPROBE_EVENTS=y" >> arch/${{ env.ARCH }}/configs/${{ env.KERNEL_CONFIG }}
        fi
        if [ ${{ env.ADD_OVERLAYFS_CONFIG }} = true ]; then
            echo "CONFIG_OVERLAY_FS=y" >> arch/${{ env.ARCH }}/configs/${{ env.KERNEL_CONFIG }}
        fi
        if [ ${{ env.DISABLE-LTO }} = true ]; then
            sed -i 's/CONFIG_LTO=y/CONFIG_LTO=n/' arch/${{ env.ARCH }}/configs/${{ env.KERNEL_CONFIG }}
            sed -i 's/CONFIG_LTO_CLANG=y/CONFIG_LTO_CLANG=n/' arch/${{ env.ARCH }}/configs/${{ env.KERNEL_CONFIG }}
            sed -i 's/CONFIG_THINLTO=y/CONFIG_THINLTO=n/' arch/${{ env.ARCH }}/configs/${{ env.KERNEL_CONFIG }}
            echo "CONFIG_LTO_NONE=y" >> arch/${{ env.ARCH }}/configs/${{ env.KERNEL_CONFIG }}
        fi
        if [ ${{ env.DISABLE_CC_WERROR }} = true ]; then
            echo "CONFIG_CC_WERROR=n" >> arch/${{ env.ARCH }}/configs/${{ env.KERNEL_CONFIG }}
        fi

        # ============ 修复 QCOM 音频头文件导致 usr/include 检查失败 ============
        # 报错：techpack/audio/include/uapi/audio/sound/msm-cirrus-playback.h
        #       使用了 uint32_t 但未 include <stdint.h>
        #       -> HDRTEST 阶段 "unknown type name 'uint32_t'"
        #
        # 修复：把该头文件加入 hdrtest 跳过列表
        #
        # 注意：不要给源文件加 #include <stdint.h>！
        #   该头文件是 UAPI 头，正常编译时 linux/types.h 已提供 uint32_t；
        #   若强行加 stdint.h，会与 linux/types.h 的 int64_t=s64 定义冲突：
        #     stdint.h: typedef __INT64_TYPE__ int64_t  (long)
        #     linux/types.h: typedef s64 int64_t        (long long)
        #     -> error: typedef redefinition with different types
        #   只需跳过 hdrtest（它才是唯一报错的地方）即可。
        if [ -f usr/include/Makefile ]; then
            if ! grep -q "audio/sound/msm-cirrus" usr/include/Makefile; then
                sed -i '/^header-test- += asm-generic\/%/a header-test- += audio/sound/msm-cirrus-playback.h' usr/include/Makefile && \
                  echo "[OK] 已将 msm-cirrus-playback.h 加入 hdrtest 跳过列表"
            fi
        fi

        # ============ 修复 WiFi 驱动栈帧超限 ============
        # 报错：qca-wifi-host-cmn/dp/wifi3.0/dp_ipa.c:1289:12:
        #   error: stack frame size of 2576 bytes in function 'dp_ipa_setup'
        #   [-Werror,-Wframe-larger-than=]
        #
        # 原理（内核 Makefile 第 779-781 行）：
        #   ifneq ($(CONFIG_FRAME_WARN),0)
        #   KBUILD_CFLAGS += -Wframe-larger-than=${CONFIG_FRAME_WARN}
        #   endif
        # 设 CONFIG_FRAME_WARN=0 后，该参数不再添加（range 0 8192，0 合法）
        sed -i '/^CONFIG_FRAME_WARN=/d' arch/${{ env.ARCH }}/configs/${{ env.KERNEL_CONFIG }}
        echo "CONFIG_FRAME_WARN=0" >> arch/${{ env.ARCH }}/configs/${{ env.KERNEL_CONFIG }}
        echo "[OK] 已设置 CONFIG_FRAME_WARN=0"

        # 5.4 内核没有 CONFIG_CC_WERROR 配置项（较新内核才有）
        # 所以额外通过 GCC_PLUGINS 之外的途径再兜底：降低严格的警告等级
        sed -i '/^CONFIG_WERROR=/d' arch/${{ env.ARCH }}/configs/${{ env.KERNEL_CONFIG }}
        echo "# CONFIG_WERROR is not set" >> arch/${{ env.ARCH }}/configs/${{ env.KERNEL_CONFIG }}
        echo "[OK] 已关闭 CONFIG_WERROR（若存在）"

    - name: Pre-flight check - kconfig 死循环快速失败
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        export PATH=$GITHUB_WORKSPACE/kernel_workspace/clang-aosp/bin:$PATH

        # ---- 静态检查 ----
        # 找出 int/hex 类型 + 有 prompt + 无 default 的配置项。
        # 这类项若值为空，syncconfig 会报 "symbol value '' invalid"
        # 然后 "Error in reading or end of file"【无限循环】。
        echo "===== 静态检查：无 default 的 int/hex 项 ====="
        python3 $GITHUB_WORKSPACE/scripts/check_no_default_int.py \
            . $GITHUB_WORKSPACE/configs/renoir_stock_kernelsu_defconfig \
            || { echo "::error::存在无有效值的 int/hex 项，会导致 kconfig 死循环"; exit 1; }

        # ---- 动态检查 ----
        # 真跑一遍 kconfig，加 timeout；退出码 124 = 超时 = 死循环。
        # 上一次就是因为没这层保护，白白烧了 1 小时才发现。
        echo "===== 动态检查：实际执行 kconfig（最长 15 分钟）====="
        set +e
        timeout 900 make -j$(nproc --all) CC=clang O=out ARCH=${{ env.ARCH }} \
            ${{ env.CUSTOM_CMDS }} ${{ env.EXTRA_CMDS }} \
            ${{ env.GCC_64 }} ${{ env.GCC_32 }} \
            ${{ env.KERNEL_CONFIG }} > cfg_check.log 2>&1
        rc=$?
        set -e
        tail -20 cfg_check.log
        if [ $rc -eq 124 ]; then
            echo "::error::kconfig 超时（死循环）—— 参见 cfg_check.log 末尾"
            exit 1
        fi
        if [ $rc -ne 0 ]; then
            echo "::error::kconfig 执行失败 rc=$rc"
            exit 1
        fi
        # 死循环的另一个特征：日志里出现大量重复行
        if [ "$(grep -c 'Error in reading' cfg_check.log)" -gt 5 ]; then
            echo "::error::cfg_check.log 里出现 'Error in reading' 重复 -> 死循环"
            exit 1
        fi
        echo "[OK] kconfig 正常，不会死循环"

    - name: Setup ccache
      if: env.ENABLE_CCACHE == 'true'
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: build-kernel-${{ env.DEVICE }}${{ env.LOCALVERSION }}${{ env.UPLOADNAME }}
        max-size: 2G

    - name: Build kernel
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        export PATH=$GITHUB_WORKSPACE/kernel_workspace/clang-aosp/bin:$PATH
        export KBUILD_BUILD_HOST=Github-Action
        export KBUILD_BUILD_USER=$(echo ${{ github.actor }} | tr A-Z a-z)
        # ★★ 复刻原厂 UTS_VERSION（重要，勿删）★★
        # 小米构建系统会把 f2fs 源码哈希追加到内核版本串尾部，实测原厂为：
        #   "#1 SMP PREEMPT Tue Nov 28 08:24:49 UTC 2023 f2fs-hash:1e2949fb28"
        # 而 scripts/mkcompile_h 里 UTS_TRUNCATE="cut -b -64"，上面这串正好 64 字符。
        # 该串会出现在 /proc/version 与 uname -a 中；MIUI 用户态会读取它
        # 判断内核是否变更（f2fs 相关），不带后缀可能与原厂行为不一致。
        # 设成原厂同值 => 我们的 UTS_VERSION 与原厂逐字节相同。
        # （注：vermagic 不含此串，模块加载不受影响；此处属额外保险）
        export KBUILD_BUILD_TIMESTAMP="Tue Nov 28 08:24:49 UTC 2023 f2fs-hash:1e2949fb28"
        export KBUILD_BUILD_VERSION=1
        if [ ! -z ${{ env.KSU_EXPECTED_SIZE }} ] && [ ! -z ${{ env.KSU_EXPECTED_HASH }} ]; then
          export KSU_EXPECTED_SIZE=${{ env.KSU_EXPECTED_SIZE }}
          export KSU_EXPECTED_HASH=${{ env.KSU_EXPECTED_HASH }}
        fi
        make -j$(nproc --all) CC=clang O=out ARCH=${{ env.ARCH }} ${{ env.CUSTOM_CMDS }} ${{ env.EXTRA_CMDS }} ${{ env.GCC_64 }} ${{ env.GCC_32 }} ${{ env.KERNEL_CONFIG }}
        if [ ${{ env.ENABLE_CCACHE }} = true ]; then
            make -j$(nproc --all) CC="ccache clang" O=out ARCH=${{ env.ARCH }} ${{ env.CUSTOM_CMDS }} ${{ env.EXTRA_CMDS }} ${{ env.GCC_64 }} ${{ env.GCC_32 }}
        else
            make -j$(nproc --all) CC=clang O=out ARCH=${{ env.ARCH }} ${{ env.CUSTOM_CMDS }} ${{ env.EXTRA_CMDS }} ${{ env.GCC_64 }} ${{ env.GCC_32 }}
        fi

    - name: CRC pre-check - 模块 ABI 报告（原厂模块能否加载，不阻塞构建）
      continue-on-error: true
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel || {
          echo "::error::内核源码目录不存在"; exit 1
        }
        S=out/Module.symvers
        [ -f "$S" ] || S=Module.symvers
        if [ ! -f "$S" ]; then
          echo "::error::找不到 Module.symvers（构建没有正常完成）"
          exit 1
        fi
        echo "  我们的符号表: $S ($(wc -l < "$S") 行)"
        python3 $GITHUB_WORKSPACE/scripts/crc_check.py "$S" \
          $GITHUB_WORKSPACE/configs/vendor_module_crc.txt

    - name: Verify kernel release (vermagic)
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        ACTUAL=$(cat out/include/config/kernel.release 2>/dev/null || echo "NOT_FOUND")
        EXPECTED="5.4.233-qgki-ge0ae3f4f4643"
        echo "实际内核版本: $ACTUAL"
        echo "原厂内核版本: $EXPECTED"
        if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::内核版本号与原厂不一致！原厂 /vendor 下的内核模块将无法加载，禁止刷入。"
            exit 1
        fi
        echo "[OK] 版本号一致，vermagic 应可匹配原厂模块"

        # ---- 附加校验：UTS_VERSION 是否含原厂 f2fs-hash 后缀 ----
        IMG=out/arch/${{ env.ARCH }}/boot/${{ env.KERNEL_IMAGE_NAME }}
        if strings -a "$IMG" | grep -qF "f2fs-hash:1e2949fb28"; then
            echo "[OK] UTS_VERSION 含原厂 f2fs-hash:1e2949fb28"
            strings -a "$IMG" | grep -m1 -F "Linux version"
        else
            echo "::error::内核版本串缺少 f2fs-hash:1e2949fb28（MIUI 可能据此判断内核变更）"
            exit 1
        fi

    - name: Verify kernel config vs factory (module ABI compatibility)
      # 换树后本步仅作参考报告：配置以原厂 .config 为权威，
      # 但新树 Kconfig 对个别符号的定义可能有差异，不应因此中断构建。
      # 真正的模块 ABI 验收由本地 CRC 预检（deliver.sh / crc_check）完成。
      continue-on-error: true
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        python3 $GITHUB_WORKSPACE/scripts/verify_config.py \
          android-kernel/out/arch/${{ env.ARCH }}/boot/${{ env.KERNEL_IMAGE_NAME }} \
          $GITHUB_WORKSPACE/configs/renoir_factory_reference.config \
          android-kernel

    - name: Check a kernel output files
      run: |
       cd $GITHUB_WORKSPACE/kernel_workspace
       if [ -f android-kernel/out/arch/${{ env.ARCH }}/boot/${{ env.KERNEL_IMAGE_NAME }} ]; then
           echo "CHECK_FILE_IS_OK=true" >> $GITHUB_ENV
       else
           echo "Kernel output file is empty"
           exit 1
       fi
       if [ ${{ env.NEED_DTBO }} = true ]; then
           if [ -f android-kernel/out/arch/${{ env.ARCH }}/boot/dtbo.img ]; then
               echo "CHECK_DTBO_IS_OK=true" >> $GITHUB_ENV
           else
               echo "DTBO image is empty"
               exit 1
           fi
       fi
  
    - name: Make Anykernel3
      if: env.CHECK_FILE_IS_OK == 'true' && env.USE_CUSTOM_ANYKERNEL3 != 'true'
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone https://github.com/osm0sis/AnyKernel3 --depth=1 AnyKernel3
        sed -i 's/do.devicecheck=1/do.devicecheck=0/g' AnyKernel3/anykernel.sh
        # ★ 新版 AnyKernel3 的变量名是全大写（BLOCK / IS_SLOT_DEVICE），
        #   模板原来的小写 sed（block= / is_slot_device=）根本匹配不到，
        #   导致 BLOCK 仍是三星 Galaxy Nexus 的 OMAP 路径：
        #     /dev/block/platform/omap/omap_hsmmc.0/by-name/boot
        #   刷机时会 abort："Unable to determine ... partition. Aborting..."
        sed -i 's!^BLOCK=.*!BLOCK=boot;!' AnyKernel3/anykernel.sh
        sed -i 's!^IS_SLOT_DEVICE=.*!IS_SLOT_DEVICE=auto;!' AnyKernel3/anykernel.sh
        # 兜底（处理旧版小写变量）
        sed -i 's!^block=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot;!block=auto;!g' AnyKernel3/anykernel.sh
        sed -i 's!^is_slot_device=0;!is_slot_device=auto;!g' AnyKernel3/anykernel.sh
        echo "===== anykernel.sh 最终关键配置 ====="
        grep -nE "^(kernel.string|do\.|BLOCK=|IS_SLOT_DEVICE=|block=|is_slot_device=)" AnyKernel3/anykernel.sh || true
        echo "===================================="
        cp android-kernel/out/arch/${{ env.ARCH }}/boot/${{ env.KERNEL_IMAGE_NAME }} AnyKernel3/
        if [ ${{ env.CHECK_DTBO_IS_OK }} = true ]; then
            cp android-kernel/out/arch/${{ env.ARCH }}/boot/dtbo.img AnyKernel3/
        fi
        rm -rf AnyKernel3/.git* AnyKernel3/README.md

    - name: Make Custom-Anykernel3
      if: env.CHECK_FILE_IS_OK == 'true' && env.USE_CUSTOM_ANYKERNEL3 == 'true'
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        if [[ ${{ env.CUSTOM_ANYKERNEL3_SOURCE }} =~ git ]]; then
            if [[ ${{ env.CUSTOM_ANYKERNEL3_SOURCE }} == *'.tar.gz' ]]; then
                wget -O AnyKernel3.tar.gz ${{ env.CUSTOM_ANYKERNEL3_SOURCE }}
                mkdir AnyKernel3
                tar -C AnyKernel3/ -zxvf AnyKernel3.tar.gz
            else
                git clone ${{ env.CUSTOM_ANYKERNEL3_SOURCE }} -b ${{ env.CUSTOM_ANYKERNEL3_BRANCH }} --depth=1 AnyKernel3
            fi
        else
            wget -O AnyKernel3.zip ${{ env.CUSTOM_ANYKERNEL3_SOURCE }}
            mkdir AnyKernel3
            unzip AnyKernel3.zip -d AnyKernel3/
        fi
        cp android-kernel/out/arch/${{ env.ARCH }}/boot/${{ env.KERNEL_IMAGE_NAME }} AnyKernel3/
        if [ ${{ env.CHECK_DTBO_IS_OK }} = true ]; then
            cp android-kernel/out/arch/${{ env.ARCH }}/boot/dtbo.img AnyKernel3/
        fi
        rm -rf AnyKernel3/.git* AnyKernel3/README.md

    - name: Verify vermagic - 必须与小米原厂一字不差
      if: always()
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel || {
          echo "::warning::内核源码/Build kernel 未就绪，跳过校验（这不是产物问题）"
          exit 0
        }
        U=out/include/generated/utsrelease.h
        [ -f "$U" ] || U=include/generated/utsrelease.h
        echo "--- $U ---"
        cat "$U" 2>/dev/null || echo "(文件不存在，说明还没走到生成阶段)"
        echo "--- vmlinux 里的版本串 ---"
        strings vmlinux 2>/dev/null | grep -m3 -E '^5\.4\.[0-9]+' || true
        if grep -q '5.4.233-qgki-ge0ae3f4f4643' "$U" 2>/dev/null; then
          echo "[OK] vermagic = 5.4.233-qgki-ge0ae3f4f4643，与小米原厂一致，stock 模块可加载"
        else
          echo "::warning::vermagic 与小米原厂不一致 —— 此内核刷入会卡 logo，不要用"
        fi

    - name: Make boot image
      if: env.HAVE_SOURCE_BOOT_IMAGE == 'true' && env.CHECK_FILE_IS_OK == 'true'
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        tools/unpack_bootimg.py --boot_img boot-source.img
        cp android-kernel/out/arch/${{ env.ARCH }}/boot/${{ env.KERNEL_IMAGE_NAME }} out/kernel
        tools/mkbootimg.py ${{ env.FORMAT_MKBOOTING }} -o boot.img
        if [ -f boot.img ]; then
            echo "MAKE_BOOT_IMAGE_IS_OK=true" >> $GITHUB_ENV
        else
            echo "Boot image is empty"
            exit 1
        fi
    
    - name: Upload Module.symvers - CRC 表，便于本地复核
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Module.symvers-${{ github.run_number }}
        path: kernel_workspace/android-kernel/out/Module.symvers
        if-no-files-found: ignore
        retention-days: 3

    - name: Upload ${{ env.KERNEL_IMAGE_NAME }}
      if: env.CHECK_FILE_IS_OK == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.KERNEL_IMAGE_NAME }}${{ env.LOCALVERSION }}${{ env.UPLOADNAME }}-${{ env.DEVICE }}-${{ env.BUILD_TIME }}
        path: kernel_workspace/android-kernel/out/arch/${{ env.ARCH }}/boot/${{ env.KERNEL_IMAGE_NAME }}

    - name: Upload AnyKernel3
      if: env.CHECK_FILE_IS_OK == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: AnyKernel3${{ env.LOCALVERSION }}${{ env.UPLOADNAME }}-${{ env.DEVICE }}-${{ env.BUILD_TIME }}
        path: kernel_workspace/AnyKernel3/*

    - name: Upload DTBO image
      if: env.CHECK_DTBO_IS_OK == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: dtbo-${{ env.DEVICE }}-${{ env.BUILD_TIME }}
        path: kernel_workspace/android-kernel/out/arch/${{ env.ARCH }}/boot/dtbo.img

    - name: Upload boot image
      if: env.MAKE_BOOT_IMAGE_IS_OK == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: boot${{ env.LOCALVERSION }}${{ env.UPLOADNAME }}-${{ env.DEVICE }}-${{ env.BUILD_TIME }}
        path: kernel_workspace/boot.img
